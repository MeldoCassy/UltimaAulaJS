<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>ATEEZ</title>
</head>
<body>
    <main class="container">
        <div class="icone">
            <img src="" alt="">
        </div>
        <h1>ATEEZ</h1>
        <p>Preencha o formulário para se tornar uma ATINY</p>

        <form id="formulario">
            <label for="nome">Nome Completo da Atiny:</label>
            <input type="text" id="nome" placeholder="digite seu nome" required>
            <label for="email">Digite seu E-mail Atiny</label>
            <input type="email" id="email" placeholder="Digite o seu-email" required>
            
            <label for="telefone">telefone:</label>
            <input type="tel" id="telefone" placeholder="(11)99999-9999" required>

            <label for="Carat">Selecione os seus membros!</label>
            <select id="Membros">
                <option value="">Selecione uma opção</option>
                <option value="San">San</option>
                <option value="Mingi">Mingi</option>
                <option value="Wooyoung">Wooyoung</option>
                <option value="Todas os membros restantes">Todas os membros restantes</option>
            </select>

            <label for="mensagem">Observações:</label>
            <textarea id="mensagem" placeholder="Digite a sua mensagem"></textarea>

            <button type="submit">Enviar Solicitação</button>
        </form>
    </main>
    <script src="./main.js"></script>
</body>
</html>
